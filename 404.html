<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — Rakeh Saleem</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Self-contained on purpose: GitHub Pages serves 404.html for ANY missing
   URL, including nested paths where relative asset links would break. */
:root{--paper:#FDFBF8;--ink:#26201A;--muted:#665A4E;--line:#EAE1D5;--teal:#B4530A}
@media (prefers-color-scheme:dark){
  :root{--paper:#171009;--ink:#F1EAE2;--muted:#B5A697;--line:#342718;--teal:#E8956D}
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;background:var(--paper);color:var(--ink);
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:24px;line-height:1.65;
  background-image:radial-gradient(color-mix(in srgb,var(--line) 90%,transparent) 1.2px,transparent 1.2px);
  background-size:26px 26px}
.code{font-family:'IBM Plex Mono',monospace;font-size:64px;color:var(--teal);font-weight:500}
h1{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:600;margin:6px 0}
p{color:var(--muted);margin-bottom:28px;max-width:44ch}
a{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:12px;
  font-size:14.5px;font-weight:500;background:var(--teal);color:#FDF4EC;text-decoration:none}
@media (prefers-color-scheme:dark){a{color:#2A1608}}
</style>
</head>
<body>
  <div class="code">404</div>
  <h1>No fixations detected here</h1>
  <p>This page doesn't exist — even an expert inspector wouldn't find damage to report.</p>
  <a href="/">Back to home →</a>
</body>
</html>
