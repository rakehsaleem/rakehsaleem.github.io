<script>
  window.addEventListener('DOMContentLoaded', () => {
    if (typeof VANTA !== 'undefined') {
      VANTA.NET({
        el: "body",
        mouseControls: true,
        touchControls: true,
        gyroControls: false,
        minHeight: 200.00,
        minWidth: 200.00,
        scale: 1.00,
        scaleMobile: 1.00,
        color: 0x003366,
        backgroundColor: 0xffffff,
        points: 10.00,
        maxDistance: 20.00,
        spacing: 15.00
      })
    }
  });
</script>
